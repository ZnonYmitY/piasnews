name: Update Piasnews Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      apply_only:
        description: "Apply committed translation mappings without fetching fresh data"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: piasnews-write
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.refresh.outputs.should_run }}
      reason: ${{ steps.refresh.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether a full refresh is due
        id: refresh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/should_refresh.py

  update:
    needs: gate
    if: ${{ needs.gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Snapshot current public data
        run: |
          mkdir -p "$RUNNER_TEMP/piasnews-before-data"
          cp data/items.json data/daily.json data/social.json data/calendar.json data/immersive_translations.zh.json data/history-candidates.json "$RUNNER_TEMP/piasnews-before-data/" 2>/dev/null || true

      - name: Fetch latest Piasnews data
        if: ${{ inputs.apply_only != true }}
        run: python scripts/fetch_piasnews.py --days 3 --retention-days 7 --limit 200 --output-dir data

      - name: Fetch Formula 1 calendar
        if: ${{ inputs.apply_only != true }}
        run: python scripts/fetch_f1_calendar.py --output data/calendar.json

      - name: Build Formula 1 calendar files
        if: ${{ inputs.apply_only != true }}
        run: python scripts/build_f1_calendar_ics.py --calendar data/calendar.json --race-output data/next-race.ics --weekend-output data/next-weekend.ics --season-output data/full-season.ics

      - name: Fetch optional X and Instagram social data
        if: ${{ inputs.apply_only != true }}
        env:
          PIASNEWS_X_BEARER_TOKEN: ${{ secrets.PIASNEWS_X_BEARER_TOKEN }}
          PIASNEWS_SOCIAL_INPUT_JSON: ${{ vars.PIASNEWS_SOCIAL_INPUT_JSON }}
          PIASNEWS_SOCIAL_INPUT_URL: ${{ vars.PIASNEWS_SOCIAL_INPUT_URL }}
          PIASNEWS_SOCIAL_INPUT_AUTH_BEARER: ${{ secrets.PIASNEWS_SOCIAL_INPUT_AUTH_BEARER }}
        run: python scripts/fetch_social_sources.py --days 3 --retention-days 7 --limit 300 --output data/social.json

      - name: Validate retained social media
        if: ${{ inputs.apply_only != true }}
        run: python scripts/validate_social_media.py --before "$RUNNER_TEMP/piasnews-before-data/social.json" --after data/social.json

      - name: Install offline Chinese translation fallback
        run: python -m pip install argostranslate

      - name: Apply offline Chinese translation fallback
        run: python scripts/translate_zh_argos.py --items data/items.json --social data/social.json --strict-argos

      - name: Generate LLM Chinese translation mappings
        env:
          PIASNEWS_LLM_TRANSLATION_API_KEY: ${{ secrets.PIASNEWS_LLM_TRANSLATION_API_KEY }}
          PIASNEWS_LLM_TRANSLATION_BASE_URL: ${{ vars.PIASNEWS_LLM_TRANSLATION_BASE_URL }}
          PIASNEWS_LLM_TRANSLATION_MODEL: ${{ vars.PIASNEWS_LLM_TRANSLATION_MODEL }}
        run: python scripts/translate_zh_llm_mapping.py --items data/items.json --social data/social.json --mapping data/immersive_translations.zh.json --limit 80

      - name: Apply Chinese translation mappings
        run: python scripts/apply_immersive_translations.py --mapping data/immersive_translations.zh.json --items data/items.json --social data/social.json --engine piasnews_llm_translation --engine immersive_translate_chrome

      - name: Prune inactive translation cache
        run: python scripts/prune_translation_cache.py --days 8

      - name: Build manual translation fallback status
        run: python scripts/build_translation_fallback_status.py

      - name: Audit translation badcases
        run: |
          python scripts/audit_translations.py \
            --items data/items.json \
            --social data/social.json \
            --review /tmp/piasnews-no-production-review.csv \
            --candidates data/translation_candidates.csv \
            --latest-csv data/translation_candidates_latest.csv \
            --latest-xlsx data/translation_candidates_latest.xlsx

      - name: Upload translation badcase Excel
        uses: actions/upload-artifact@v4
        with:
          name: piasnews-translation-badcase-candidates
          path: |
            data/translation_candidates_latest.csv
            data/translation_candidates_latest.xlsx

      - name: Build history-review candidates
        run: python scripts/build_history_candidates.py

      - name: Build merged hot-event ranking
        run: python scripts/build_hot_events.py --refresh-reason "${{ needs.gate.outputs.reason }}"

      - name: Validate history knowledge base
        run: python scripts/validate_history.py

      - name: Build Feishu refresh notification summary
        env:
          PIASNEWS_PAGE_URL: https://znonymity.github.io/piasnews/
        run: python scripts/notify_feishu_refresh.py --build-summary --before-dir "$RUNNER_TEMP/piasnews-before-data" --data-dir data --summary-json "$RUNNER_TEMP/piasnews-refresh-summary.json"

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json data/daily.json data/rss.xml data/calendar.json data/next-race.ics data/next-weekend.ics data/full-season.ics data/social.json data/immersive_translations.zh.json data/translation-fallback.json data/history-candidates.json data/hot-events.json data/translation_candidates.csv
          if git diff --cached --quiet; then
            echo "No Piasnews data changes."
          else
            git commit -m "Update Piasnews data"
            git push || {
              git pull --rebase origin main
              git push
            }
          fi

      - name: Prepare Pages artifact
        env:
          PIASNEWS_WORKER_URL: ${{ vars.PIASNEWS_WORKER_URL }}
        run: |
          mkdir -p public/data
          cp data/items.json data/daily.json data/rss.xml data/calendar.json data/next-race.ics data/next-weekend.ics data/full-season.ics data/social.json data/history.json data/history-candidates.json data/hot-events.json data/translation-fallback.json data/hot-event-overrides.json public/data/
          cp data/translation_candidates.csv public/data/translation_candidates.csv
          cp data/translation_candidates_latest.csv public/data/translation_candidates_latest.csv
          cp data/translation_candidates_latest.xlsx public/data/translation_candidates_latest.xlsx
          cp piasnews/references/history-retrieval.json public/data/history-retrieval.json
          PIASNEWS_IMMERSIVE_WORKBENCH_DIR=public/immersive PIASNEWS_IMMERSIVE_TARGETS=missing PIASNEWS_IMMERSIVE_TABS=1 node scripts/build_immersive_workbench.mjs
          python scripts/write_runtime_config.py --output public/data/runtime-config.json
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Feishu translation badcases
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_BASE_URL: ${{ vars.FEISHU_BASE_URL }}
          PIASNEWS_PAGE_URL: https://znonymity.github.io/piasnews/
        run: python scripts/notify_feishu_badcases.py --latest-csv data/translation_candidates_latest.csv

      - name: Notify Feishu public refresh
        env:
          PIASNEWS_FEISHU_WEBHOOK_URL: ${{ secrets.PIASNEWS_FEISHU_WEBHOOK_URL }}
          PIASNEWS_PAGE_URL: https://znonymity.github.io/piasnews/
        run: python scripts/notify_feishu_refresh.py --summary-json "$RUNNER_TEMP/piasnews-refresh-summary.json"
